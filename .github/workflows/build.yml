name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build InvoiceApp.slnx -c Debug

      # Same command as publish.ps1: a self-contained single InvoiceApp.exe
      - name: Publish executable
        run: >
          dotnet publish src/InvoiceApp.Web/InvoiceApp.Web.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          -o dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceApp-win-x64
          path: |
            dist/InvoiceApp.exe
            dist/appsettings.json
            dist/wwwroot/**
            dist/*.staticwebassets.endpoints.json
